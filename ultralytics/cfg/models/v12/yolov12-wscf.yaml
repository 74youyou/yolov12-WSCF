# YOLOv12 🚀, AGPL-3.0 license
# YOLOv12-WSCF (Wavelet Skip Cross-scale Fusion) object detection model with P3-P5 outputs.
# Based on YOLOv12-turbo: a wavelet branch decomposes the raw RGB image into W1/W2/W3/W4 and injects them
# into the backbone through four fusion paths:
#   1) P1 + W1 concat -> 1x1 conv        (P1WaveletFusion, identity at init)
#   2) P3 (Query) <- W2 (Key/Value)      (CrossScaleFusion, 3x3 window attention, zero-init output)
#   3) P4 (Query) <- W3 (Key/Value)      (CrossScaleFusion, 3x3 window attention, zero-init output)
#   4) P5 (Query) <- W4 (Key/Value)      (CrossScaleFusion, 3x3 window attention, zero-init output)
# All fusion modules are identity mappings at initialization, so the model is equivalent to the original
# YOLOv12 at the start of training and pretrained weights are preserved.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov12-wscf.yaml' will call this yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO12-turbo backbone + wavelet branch (W1/W2/W3/W4 injection)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []] # 0: raw input image (B, 3, H, W)
  - [-1, 1, WaveletBranch, [True, 0.25]] # 1: 4-level Haar + GRN-v3, returns (W1,W2,W3,W4), each 4*3=12 ch
  - [1, 1, Index, [12, 0]] # 2: W1 (H/2,  12 ch)
  - [1, 1, Index, [12, 1]] # 3: W2 (H/4,  12 ch)
  - [1, 1, Index, [12, 2]] # 4: W3 (H/8,  12 ch)
  - [1, 1, Index, [12, 3]] # 5: W4 (H/16, 12 ch)

  - [0, 1, Conv, [64, 3, 2]] # 6-P1/2  (C1=64)
  - [[6, 2], 1, P1WaveletFusion, [16, True]] # 7: P1 + W1 -> C1 (W1 proj conv + SiLU, identity at init)

  - [-1, 1, Conv, [128, 3, 2, 1, 2]] # 8-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 9
  - [-1, 1, Conv, [256, 3, 2, 1, 4]] # 10-P3/8
  - [[3, 10], 1, CrossScaleFusion, [256, 16, 3, 2, 0.0]] # 11: P3 <- W2 (window attn, embed=64/heads=4 @ n)

  - [-1, 2, C3k2, [512, False, 0.25]] # 12
  - [-1, 1, Conv, [512, 3, 2]] # 13-P4/16
  - [[4, 13], 1, CrossScaleFusion, [512, 32, 3, 2, 0.0]] # 14: P4 <- W3 (window attn, embed=128/heads=8 @ n)

  - [-1, 4, A2C2f, [512, True, 4]] # 15
  - [-1, 1, Conv, [1024, 3, 2]] # 16-P5/32
  - [[5, 16], 1, CrossScaleFusion, [512, 32, 3, 2, 0.0]] # 17: P5 <- W4 (window attn, embed=128/heads=8 @ n)

  - [-1, 4, A2C2f, [1024, True, 1]] # 18

# YOLO12-turbo head (PAN)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20: cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 21

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23: cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 21], 1, Concat, [1]] # 26: cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 18], 1, Concat, [1]] # 29: cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 30 (P5/32-large)

  - [[24, 27, 30], 1, Detect, [nc]] # 31: Detect(P3, P4, P5)
